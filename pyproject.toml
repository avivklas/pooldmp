[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pooledmp"
version = "0.1.0"
description = "Pooled long-lived control connections for multiprocessing managers"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "benchmarks"]
mypy_path = "src"
